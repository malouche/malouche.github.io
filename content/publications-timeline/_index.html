        const addTopics = (publications) => {
          const topics = {
            "COVID-19": ["covid", "pandemic"],
            "Graphical Models": ["graph", "markov", "conditional independence", "faithful"],
            "Public Health": ["health", "mortality", "disease", "epidemio", "covid"],
            "Olive Oil": ["olive", "oil"],
            "Bayesian": ["bayes", "bayesian"],
            "Sensory Analysis": ["sensory", "consumer", "sensmap"],
            "Data Science": ["data", "tracker", "analysis"],
            "Mathematics": ["exponential", "pick", "markov", "probability", "theorem"],
            "Tunisia": ["tunisia", "tunisian"],
            "Multiple Sclerosis": ["sclerosis", "MS"]
          };
        
          return publications.map(pub => {
            const pubTopics = [];
            const searchText = (pub.title + " " + pub.abstract).toLowerCase();
            
            for (const [topic, keywords] of Object.entries(topics)) {
              if (keywords.some(keyword => searchText.includes(keyword.toLowerCase()))) {
                pubTopics.push(topic);
              }
            }
            
            return { ...pub, topics: pubTopics };
          });
        };

          const [publications, setPublications] = React.useState([]);

          const [popupInfo, setPopupInfo] = React.useState(null);

            // Initialize with publications data with topics added
            const pubsWithTopics = addTopics(publicationsData);
            setPublications(pubsWithTopics);
            
            // Get unique years and set them as visible years
            const years = [...new Set(pubsWithTopics.map(pub => pub.year))].sort((a, b) => a - b);
            setVisibleYears(years);
            
            // Set initial year to the most recent
            setSelectedYear(years[years.length - 1]);
          }, []);
          
          // Get all unique topics across all publications
          const allTopics = React.useMemo(() => {
            const topics = new Set();
            publications.forEach(pub => {
              pub.topics?.forEach(topic => topics.add(topic));
            });
            return [...topics].sort();
          }, [publications]);
          
          // Handle topic filter toggle
          const toggleFilter = (topic) => {
            if (activeFilters.includes(topic)) {
              setActiveFilters(activeFilters.filter(t => t !== topic));
            } else {
              setActiveFilters([...activeFilters, topic]);
            }
          };
          
          // Filter publications by active topics
          const filteredPublications = React.useMemo(() => {
            if (activeFilters.length === 0) return publications;
            
            return publications.filter(pub => 
              activeFilters.some(filter => pub.topics?.includes(filter))
            );
          }, [publications, activeFilters]);
          
          // Navigate to previous year

            const index = visibleYears.indexOf(selectedYear);
            if (index > 0) {
              setSelectedYear(visibleYears[index - 1]);
            }
          };

          const goToNextYear = () => {
            const index = visibleYears.indexOf(selectedYear);
            if (index < visibleYears.length - 1) {
              setSelectedYear(visibleYears[index + 1]);
            }

            const Icon = React.createElement('span', {
              className: 'lucide-icon',
              dangerouslySetInnerHTML: { __html: icon.toSVG({ width: 20, height: 20 }) }
            });
            return Icon;
          };

                          onMouseLeave={() => setHoveredPublication(null)}

                            <button

                              }}

                              {createIcon(Info)}
                            </button>
                          </div>

                              <h4 className="font-bold text-sm">{pub.title}</h4>
                              <p className="text-xs text-gray-600 mt-1">{pub.authors}</p>
                              <p className="text-xs mt-2">{pub.abstract}</p>
                              {(pub.doi || pub.url) && (
                                <a 
                                  href={pub.doi ? `https://doi.org/${pub.doi}` : pub.url}

                                  View publication
                                </a>
                              )}

                          )}

                      );

                </div>

                    No publications found for {selectedYear} with the current filters.

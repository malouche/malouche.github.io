                        {activeSection === 'forest' && (<div>
                            <div className="plot-selector">{Object.entries(plotConfigs).map(([k,c]) => (<button key={k} onClick={() => setPlotType(k)} className={`plot-btn ${plotType === k ? 'active' : ''}`} style={plotType === k ? {backgroundColor:`${c.color}20`,borderColor:`${c.color}50`,color:c.color} : {}}>{c.title.split(':')[0]}</button>))}</div>
                            <div className="card"><div className="forest-header"><h3 className="forest-title">{plotConfigs[plotType].title}</h3><div className="forest-meta"><span>Pooled {plotConfigs[plotType].metric.toUpperCase()}: <strong style={{color:plotConfigs[plotType].color}}>{plotConfigs[plotType].pooled.toFixed(2)}</strong></span><span>|</span><span>I² = {plotConfigs[plotType].heterogeneity}</span></div></div><ForestPlot data={plotConfigs[plotType].data} color={plotConfigs[plotType].color} pooled={plotConfigs[plotType].pooled} metric={plotConfigs[plotType].metric} heterogeneity={plotConfigs[plotType].heterogeneity} /></div>
                            <div className={`interpretation-box ${plotConfigs[plotType].warning ? 'negative' : 'positive'}`}><p className="interpretation-title" style={{color:plotConfigs[plotType].warning ? 'var(--rose-400)' : 'var(--emerald-400)'}}>{plotConfigs[plotType].warning ? '⚠️ Warning' : '✓ Interpretation'}</p><p className="interpretation-text">{interpretations[plotType]}</p></div>
                        </div>)}

                        {activeSection === 'implications' && (<div>
                            <div className="card"><h3 className="card-title"><span style={{color:'var(--emerald-400)'}}>◇</span> Key Conclusions</h3><div className="conclusions-grid"><div><div className="conclusion-item"><div className="conclusion-icon positive">✓</div><div><p className="conclusion-title">ICI + Chemo Shows Promise</p><p className="conclusion-desc">18% mortality reduction with consistent results</p></div></div><div className="conclusion-item"><div className="conclusion-icon positive">✓</div><div><p className="conclusion-title">Biomarker Selection Critical</p><p className="conclusion-desc">High TMB and dMMR patients respond best</p></div></div></div><div><div className="conclusion-item"><div className="conclusion-icon negative">⚠</div><div><p className="conclusion-title">Caution with Radiotherapy</p><p className="conclusion-desc">ICI + RT increases mortality risk</p></div></div><div className="conclusion-item"><div className="conclusion-icon warning">!</div><div><p className="conclusion-title">Limited Monotherapy Efficacy</p><p className="conclusion-desc">ICI alone shows 0% ORR in most PDAC</p></div></div></div></div></div>
                            <div className="card" style={{background:'linear-gradient(135deg, rgba(6, 182, 212, 0.1), rgba(139, 92, 246, 0.1))',borderColor:'rgba(6, 182, 212, 0.2)'}}><h3 className="card-title"><span style={{color:'var(--cyan-400)'}}>🔬</span> Future Research</h3><div>{[{area:"Predictive Biomarkers",desc:"Develop and validate for optimal patient selection"},{area:"Novel Combinations",desc:"ICIs with targeted therapies and vaccines"},{area:"TME Modulation",desc:"Convert 'cold' tumors to 'hot' phenotypes"},{area:"Personalized Approaches",desc:"Multi-omic data for individualized treatment"}].map((f,i) => (<div key={i} className="future-item"><div className="future-dot"></div><div><p className="future-title">{f.area}</p><p className="future-desc">{f.desc}</p></div></div>))}</div></div>
                            <div className="card"><h3 className="card-title"><span style={{color:'var(--violet-400)'}}>📋</span> Clinical Guidance</h3><table className="guidance-table"><thead><tr><th>Patient Profile</th><th>Recommended Approach</th><th>Evidence</th></tr></thead><tbody>{[{profile:"High TMB / MSI-H / dMMR",approach:"ICI combination (+ chemo)",evidence:"Moderate-High"},{profile:"Low TMB / MSS",approach:"Standard chemo; consider trials",evidence:"Moderate"},{profile:"Metastatic, first-line",approach:"ICI + chemo (gem/nab-pac)",evidence:"Moderate"},{profile:"Locally advanced",approach:"Neoadjuvant chemoRT ± ICI",evidence:"Low"}].map((r,i) => (<tr key={i}><td>{r.profile}</td><td>{r.approach}</td><td><span className={`evidence-badge ${r.evidence.includes('High')?'high':r.evidence==='Moderate'?'moderate':'low'}`}>{r.evidence}</span></td></tr>))}</tbody></table></div>
                        </div>)}
                    </div></main>
                    <footer><div className="container"><p>Based on: Al-Khinji A, et al. (2025) Immune checkpoint inhibitors in pancreatic adenocarcinoma. <span className="doi">Front. Oncol. 15:1569884</span></p><p className="note">Interactive Dashboard • Data visualization for research purposes only</p></div></footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

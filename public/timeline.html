    "abstract": "Interest in plant compounds has increased, given recent evidence regarding their role in human health due to their pleiotropic effects. For example, plant bioactive compounds present in food products, including polyphenols, are associated with preventive effects in various diseases, such as cancer or inflammation. Breast and colorectal cancers are among the most commonly diagnosed cancers globally. Although appreciable advances have been made in treatments, new therapeutic approaches are still needed. Thus, in this study, up to 28 olive leaf extracts were obtained during different seasons and using different drying temperatures. The influence of these conditions on total polyphenolic content (measured using Folin&ndash;Ciocalteu assays), antioxidant activity (using Trolox Equivalent Antioxidant Capacity and Ferric Reducing Ability of Plasma assays) and antiproliferative capacity (using 3-(4,5-dimethylthiazol-2-yl)-2,5-diphenyltetrazolium bromide, MTT assays) was tested in breast and colorectal cancer cells. Increased phenolic composition and antioxidant and antiproliferative capacity are noted in the extracts obtained from leaves harvested in autumn, followed by summer, spring and winter. Regarding drying conditions, although there is not a general trend, conditions using the highest temperatures lead to the optimal phenolic content and antioxidant and antiproliferative activities in most cases. These results confirm previously published studies and provide evidence in support of the influence of both harvesting and drying conditions on the biological activity of olive leaf extracts.",

    "id": 3,
    "title": "SensMap R package and SensMapGUI shiny web application for sensory and consumer data mapping: Variations on external preference mapping and stability assessment",
    "authors": "Ibtihel Rebhi, Dhafer Malouche",
    "abstract": "This work addresses the theory of External Preference Mapping technique (EPM) that reliably gives a mapping of human perceptions' ratings considered as subjective data onto objective descriptions generally obtained from measurable analytic data. An R package named SensMap is made available to facilitate the adoption of the EPM technique in different research fields and to propose, in addition to classical features, advanced strategies for map visualization and its stability enhancement. The novelty of SensMap is to provide options in sensory space dimension reduction methods as well as options in consumers' likings prediction models based on sensory descriptors. The fitting quality of these models can be evaluated using several information criteria. Moreover, SensMap provides a methodology to quantify and assess the stability of preference maps from different employed strategies using a computational algorithm that consists in calculations of distances between maps based on resampling approach. A small part in this paper was devoted to evaluate the efficiency of the implemented stability approach by a simulation study and by application to real data from food science field. To make easier the conduction of the multiple types of analysis without requiring high programming knowledge, a very intuitive Graphical User Interface named SensMapGUI is implemented on the SensMap package. It is an R-developed shiny web-tool that produces results and graphics quickly and efficiently. The tool is made available at the following address https://cran.r-project.org/web/packages/SensMap/index.html and is dedicated for all sensory practitioners and can be widely used by researchers who need subjective to objective data mapping.",

    "authors": "Kaouther Ben-Hassine, Amani Taamalli, Leila Rezig, Islem Yangui, Cinzia Benincasa, Dhafer Malouche, Naziha Kamoun, Wissem Mnif",
    "abstract": "Abstract This study established physicochemical and sensory characteristics of virgin olive oils (VOOs) and linked them to consumers’ liking using external preference mapping. We used five Tunisian and two foreign VOO varieties produced by two processing systems: discontinuous (sp) and continuous three-phase decanter (3p). The samples were analyzed and evaluated by a panel of 274 consumers. The external preference mapping revealed five VOO clusters with a consumer preference scores rating from 40\\% to 65\\%. Consumers highly appreciated the foreign Coratina cultivar's olive oil; the main drivers being richness in polyphenols (markers of bitterness and pungency), mainly the oleuropein aglycone, and volatile compounds (markers of green fruity, green leaves, green apple, cut grassy almond, and bitterness), particularly the trans-2-hexenol. The Tunisian Chemlali (3p) oil was second highly preferred (scoring 55\\%). The positive drivers for olive oil preference (a profile of almond fruity green and low bitterness and pungency) are the richness in hexanal compounds. Arbequina (sp and 3p) and Chemlali (sp) were the least appreciated due to the fact that Arbequina VOO is not in the tradition of Tunisian consumers, whereas Chemchali VOO is a minor variety representing only 2\\% of olive oil production in Tunisia and consumed mostly in blends. The differentiation between the two processing systems depends on the variety of cultivar; consumers are able to identify the two processing system in the case of Chetoui, Leguim, and Chemchali.",

    "id": 8,
    "title": "Describing Conditional Independence Statements Using Undirected Graphs",
    "authors": "Dhafer Malouche",
    "abstract": "This paper investigates the capability of undirected graphs (UGs) to represent a set of Conditional Independence (CI) statements derived from a given probability distribution of a random vector. While it is established that certain axioms can govern this set, providing sufficient conditions for UGs to capture specific CI statements, our focus is on covariance and concentration graphs. These remain the only known families of UGs capable of describing CI statements. We explore the issue of complete representation of CI statements through their corresponding covariance and concentration graphs. Two parameters are defined, one each from the covariance and concentration graphs, to determine the limitations concerning the cardinality of the conditioning subset that the graph can represent. We establish a relationship between these parameters and the cardinality of the separators in each graph, providing a straightforward computational method to evaluate them. In conclusion, we enhance the aforementioned procedure and introduce criteria to ascertain, without additional computations, whether the graphs can fully represent a given set of CI statements. We demonstrate that either the concentration or the covariance graph forms a cycle, and when considered in conjunction, they can represent the entire relation. These criteria also enable us, in specific cases, to deduce the covariance graph from the concentration graph and vice versa.",

    "title": "Comparison of radiograph-based texture analysis and bone mineral density with three-dimensional microarchitecture of trabecular bone",
    "authors": "P. Ranjanomennahary, S. Sevestre Ghalila, D Malouche, A. Marchadier, M. Rachidi, Cl. Benhamou, C. Chappard",
    "abstract": "Purpose: Hip fracture is a serious health problem and textural methods are being developed to assess bone quality. The authors aimed to perform textural analysis at femur on high-resolution digital radiographs compared to three-dimensional (3D) microarchitecture comparatively to bone mineral density. Methods: Sixteen cadaveric femurs were imaged with an x-ray device using a C-MOS sensor. One 17 mm square region of interest (ROI) was selected in the femoral head (FH) and one in the great trochanter (GT). Two-dimensional (2D) textural features from the co-occurrence matrices were extracted. Site-matched measurements of bone mineral density were performed. Inside each ROI, a 16 mm diameter core was extracted. Apparent density and bone volume proportion were measured from a defatted bone core using Archimedes' principle. Microcomputed tomography images of the entire length of the core were obtained (Skyscan 1072®) at of resolution and usual 3D morphometric parameters were computed on the binary volume after calibration from . Then, bone surface/bone volume, trabecular thickness, trabecular separation, and trabecular number were obtained by direct methods without model assumption and the structure model index was calculated. Results: In univariate analysis, the correlation coefficients between 2D textural features and 3D morphological parameters reached 0.83 at the FH and 0.79 at the GT. In multivariate canonical correlation analysis, coefficients of the first component reached 0.95 at the FH and 0.88 at the GT. Conclusions: Digital radiographs, widely available and economically viable, are an alternative method for evaluating bone microarchitectural structure.",

    "id": 65,
    "title": "138. Factors Affecting the Quality of Sleep and Physical Activity Participation of Multiple Sclerosis (MS) Patients: A Path Analysis",
    "authors": "Hanan Khalil, Dhafer Malouche, Saddam Kanaan, Alham Al-Sharman, Khalid El-Salim",
    "abstract": "Background/Objective(s)\nMultiple sclerosis (MS) patients are exposed to various psychosocial factors, such as depression, anxiety, fatigue and pain, which can negatively affect their quality of sleep and their participation in physical activity.\nMaterial(s) and Method(s)\nA path analysis using a Bayesian Network learning algorithm was employed to analyze MS dataset which included data collected from 100 MS patients. Analysis was performed without prioritizing a specific target variable. This approach helps determine whether pain impacts sleep or physical activity, or if sleep quality influences physical activity levels.\nResult(s)\nThe analysis revealed significant relationships among the variables. Higher anxiety levels were associated with increased physical activity, suggesting a bidirectional influence. Both anxiety and pain interaction significantly contributed to pain severity, highlighting a complex interplay between psychological factors and pain experiences. Additionally, both anxiety and depression influenced sleep quality, highlighting the importance of mental health in sleep patterns. Furthermore, factors such as the years since diagnosis, physical endurance, depression, and sleep quality influenced pain interference, providing insights into the interplay between physical and psychological factors in pain experience.\nConclusion(s)\nThe findings reveal complex and interrelated dynamics between physical activity, pain, and sleep quality, significantly influenced by psychological factors such as anxiety and depression. Understanding these relationships is crucial for developing effective interventions for MS patients.",

  {
    "id": 66,
    "title": "10. The Comparative Ability of Five Mobility and Balance Outcome Measures in Predicting the Risk of Falls in People with Multiple Sclerosis",
    "authors": "Hanan Khalil, Dhafer Malouche, Dowa Al Marri, Mariam Shoukry, Maryam Shehabi, Reem Yahia, Saddam Kanaan, Tasneem Hartley, Mozza Al-Musallam, Alham Al-Sharman, Bayan Jaradat, Khalid El-Salim",
    "abstract": "Background/Objective(s)\nPeople with MS (PwMS) have a significant occurrence of falls; this high occurrence is due to the physical and cognitive impairment associated with the disease progression. Falls may result in severe injuries which significantly affects the quality of life for (PwMS). Although many mobility outcome measures have been suggested as fall risk indicators, their validity has not been extensively validated.\nMaterial(s) and Method(s)\nA retrospective cross-sectional study included 97 PwMS with mean (SD) of age of 35.97 (11.04) years. Outcome measures included BBS, SPPB, 10MWT, 6MWT, 5xSTS. Fall history in the past 12 months was recorded. People were classified accordingly into faller (2 or more falls in the past 12 months), or non-fallers (one fall or no falls reported in the past 12 months). The data analysis utilized many approaches, such as an exhaustive search algorithm, a genetic algorithm, and a backward stepwise selection procedure. We employed the exhaustive search technique to evaluate every possible combination of predictors, ensuring the selection of the model with the lowest Akaike Information Criterion (AIC). To evaluate the predictive performance of the logistic regression models, we calculated Receiver Operating Characteristic (ROC) curves and the Area Under the Curve (AUC) for each model. The AUC was calculated to quantify the overall accuracy of each model, with higher AUC values indicating models with lower error rates and better predictive capabilities.\nResult(s)\nLogistic regression with adjustment for age and sex indicated that BBS total score, SPPB total score and 6MWT significantly predicted the fall status group (P <0.05). In a model where the interaction between predictors was examined, significant interactions were observed between 6MWT and SPPB, as well as between SPPB and BBS. These interactions suggest that the combined effects of these mobility measures play a crucial role in predicting fall risk. Additionally, the interaction between age and gender, as well as age and 5xSTS, further highlights the complexity of factors influencing fall risk in PwMS. The inclusion of these interaction terms significantly enhances the model's fit, as indicated by a lower AIC and higher pseudo R-squared value, reflecting improved predictive accuracy and reliability. This model also showed the highest discriminative ability with an AUC of 0.87, reflecting excellent performance.\nConclusion(s)\nBased on predictive validity, the BBS and the SPPB and 6MWT were the best outcome measures in this study showing statistical differences in differentiating between fallers and non-fallers in PwMS.The model that examined the interaction among predictors was the most effective in prediction with the highest discriminative ability; this suggests that the combined effect of these mobility outcomes (i.e. BBS, SPPB and 6MWT) would provide the best choice for predicting the risk of falls in this population.",

    allTopics.forEach(function(topic) {
      var container = document.createElement("div");
      container.className = "form-check mr-3";

      var checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.className = "form-check-input topic-checkbox";
      checkbox.value = topic;
      checkbox.id = "topic_" + topic;
      checkbox.checked = true;

      var label = document.createElement("label");
      label.className = "form-check-label";
      label.htmlFor = "topic_" + topic;
      label.innerText = topic;

      container.appendChild(checkbox);
      container.appendChild(label);
      topicFiltersDiv.appendChild(container);
    });

    // Create timeline items from publications.
    function createTimelineItems() {
      var items = [];
      publications.forEach(function(pub) {
        items.push({
          id: pub.id,
          content: pub.title,
          start: pub.year + "-01-01",
          title: pub.title,
          style: "background-color: " + typeColors[pub.type] + "; color: white; cursor: pointer;"
        });
      });
      return items;
    }

    var container = document.getElementById("timeline");
    var timelineItems = new vis.DataSet(createTimelineItems());
    var timelineOptions = {
      selectable: true,
      zoomable: true,
      horizontalScroll: true
    };
    var timeline = new vis.Timeline(container, timelineItems, timelineOptions);

    // When a timeline item is selected, show detailed view.
    timeline.on('select', function (properties) {
      if (properties.items.length > 0) {
        var selectedId = properties.items[0];
        var pub = publications.find(function(p) { return p.id === selectedId; });
        if (pub) {
          showPublicationDetails(pub);
        }
      }
    });

    // Display publication details in a modal.
    function showPublicationDetails(pub) {
      var modalBody = document.getElementById("modalBody");
      var html = "<h4>" + pub.title + "</h4>";
      html += "<p><strong>Authors:</strong> " + pub.authors + "</p>";
      html += "<p><strong>Venue:</strong> " + pub.venue + " (" + pub.year + ")</p>";
      if (pub.type === "journal" && pub.quality) {
        html += "<p><strong>Quality:</strong> " + pub.quality + "</p>";
      }
      html += "<p><strong>Abstract:</strong> " + pub.abstract + "</p>";
      html += "<p><strong>Links:</strong> ";
      for (var key in pub.links) {
        if (pub.links.hasOwnProperty(key)) {
          html += "<a href='" + pub.links[key] + "' target='_blank'>" + key + "</a> ";
        }
      }
      html += "</p>";
      modalBody.innerHTML = html;
      $('#detailModal').modal('show');
    }

    // Update timeline based on active topic filters and search query.
    function updateTimeline() {
      var activeTopics = Array.from(document.querySelectorAll(".topic-checkbox:checked")).map(function(checkbox) {
        return checkbox.value;
      });

      var query = document.getElementById("searchBar").value.toLowerCase();

      var filteredPubs = publications.filter(function(pub) {
        var topicMatch = pub.topics.some(function(topic) {
          return activeTopics.indexOf(topic) !== -1;
        });
        var searchMatch = (pub.title.toLowerCase().indexOf(query) !== -1) ||
                          (pub.abstract.toLowerCase().indexOf(query) !== -1);
        return topicMatch && searchMatch;
      });

      var newItems = [];
      filteredPubs.forEach(function(pub) {
        newItems.push({
          id: pub.id,
          content: pub.title,
          start: pub.year + "-01-01",
          title: pub.title,
          style: "background-color: " + typeColors[pub.type] + "; color: white; cursor: pointer;"
        });
      });

      timelineItems.clear();
      timelineItems.add(newItems);
    }

    // Add event listeners for search and topic filters.
    document.getElementById("searchBar").addEventListener("input", updateTimeline);
    document.querySelectorAll(".topic-checkbox").forEach(function(checkbox) {
      checkbox.addEventListener("change", updateTimeline);
    });
  </script>
</body>
</html>
